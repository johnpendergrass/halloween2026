<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- viewport-fit=cover lets the page reach under the iPhone notch and
     home bar; the CSS then uses env(safe-area-inset-*) to keep the frame
     clear of them. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- FULL-SCREEN "APP" MODE.
     iPhone: when launched from a home-screen icon, these tags remove the
     browser's address bar and toolbars. Android and desktop read
     manifest.json instead.
     TODO: add an apple-touch-icon (180x180) once we have artwork. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- v6 TRIAL: "black-translucent" lets the purple page background show
     behind the iPhone clock and battery. To undo: "black". iOS reads this
     when the icon is ADDED, so delete and re-add the icon to see a change. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Halloween 2026" />
    <!-- v6 TRIAL: tints the browser's own bars. To undo: #07040a -->
    <meta name="theme-color" content="#2e1a44" />
    <link rel="manifest" href="./manifest.json" />

    <title>Halloween 2026</title>

    <!-- The ?v= tag forces phones to fetch fresh code after a publish.
     Change it (and APP_VERSION in app.js) whenever the code changes. -->
    <link rel="stylesheet" href="./app/styles.css?v=2026-1016-stack-milestones" />
  </head>

  <body>
    <!-- ======================================================================
     THE 9:16 FRAME. Everything lives inside it. Top to bottom:
       1. TOP PANEL     1/16 of the frame height, always visible
       2. GAME PANEL    what is left -> 9:15. The current game's page is
                        shown here in an <iframe>.
       3. BOTTOM PANEL  a drawer. Closed = out of sight below the frame.
                        Open = slides up OVER the lower part of the game
                        panel. The game panel never changes size.
     ====================================================================== -->
    <div class="app-shell">

      <!-- 1. TOP PANEL: the ONE control. Home opens the bottom panel on the
       THIS GAME tab and closes it again. The spacer on the right is as
       wide as the Home button, so the title is centred in the bar. -->
      <header class="top-panel">
        <button class="top-icon" id="homeButton" aria-label="Open or close the panel">🏠</button>
        <div class="top-title" id="topTitle">Halloween 2026</div>
        <span class="top-icon" aria-hidden="true"></span>
      </header>

      <div class="play-area">

        <!-- 2. GAME PANEL: app.js sets the iframe's src to the chosen
         game's page, e.g. ./games/game1/index.html -->
        <main class="game-panel">
          <iframe class="game-frame" id="gameFrame" title="Game"></iframe>
        </main>

        <!-- While the bottom panel is open, this invisible sheet lies over
         the game. A tap on it closes the panel and goes no further: the
         game never receives it (and keeps running; the app never pauses
         a game). app.js shows and hides it together with the panel. -->
        <div class="game-cover" id="gameCover" hidden></div>

        <!-- 3. BOTTOM PANEL: the content only; there is no strip. Starts OPEN
         on the GAMES tab. Home (top panel) toggles it; picking a game closes it. -->
        <section class="drawer is-open" id="drawer">

          <!-- `inert` is added while the panel is closed, so its hidden
           buttons cannot be reached with the keyboard. -->
          <div class="drawer-content" id="drawerContent">
            <div class="drawer-tabs">
              <button class="is-active" data-tab="app">GAMES</button>
              <button data-tab="game">THIS GAME</button>
            </div>

            <!-- GAMES tab: app.js fills in one icon button per game in games.json:
             a board of two rows by four fixed cells; a game sits in the cell
             its goes_in_slot names (1-4 upper row, 5-8 lower row). The game
             in slot 1 is the one shown when the app starts. -->
            <div class="drawer-body" id="tab-app">
              <div class="game-buttons" id="gameButtons"></div>
            </div>

            <!-- THIS GAME tab: app.js fills every part from the current
             game's games.json entry (fillThisGameTab). Empty fields are
             hidden, so a half-filled entry still reads cleanly.
             Under the icon and name: the game's ten high scores, and,
             only for a game that declared switches in games.json, a
             second column with up to three of them. -->
            <div class="drawer-body this-game" id="tab-game" hidden>
              <div class="this-game-head">
                <img class="this-game-icon" id="thisGameIcon" alt="" draggable="false" hidden />
                <div>
                  <div class="this-game-title" id="thisGameTitle"></div>
                  <div class="this-game-byline" id="thisGameByline"></div>
                </div>
              </div>
              <div class="this-game-panels">
                <div>
                  <!-- The column's top line. Tapping Clear scores swaps it
                   for the question line below; Yes clears, No goes back. -->
                  <div class="score-head" id="scoreHead">
                    <h3 class="this-game-heading score-heading">High Scores</h3>
                    <button class="small-button" id="clearScores">Clear scores</button>
                  </div>
                  <div class="score-head" id="clearQuestion" hidden>
                    <span class="this-game-heading score-heading">You sure?</span>
                    <button class="small-button" id="clearYes">Yes</button>
                    <button class="small-button" id="clearNo">No</button>
                  </div>
                  <div class="score-list" id="thisGameScores"></div>
                </div>
                <div class="this-game-settings" id="thisGameSettings"></div>
              </div>
              <div id="thisGameDescription"></div>
              <h3 class="this-game-heading" id="thisGameHowHeading">How to play</h3>
              <div id="thisGameHowToPlay"></div>
              <p class="this-game-credits" id="thisGameCredits"></p>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="./app/app.js?v=2026-1016-stack-milestones"></script>
  </body>
</html>
