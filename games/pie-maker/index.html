<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pie Maker</title>
    <!-- Shown inside the app's game panel (an iframe), but also works on its
     own: open games/pie-maker/index.html directly to test it. -->
    <link rel="stylesheet" href="./pie-maker.css" />
  </head>

  <body>
    <!-- PIE MAKER: tap the moving pumpkins to turn them into pies. -->

    <header class="info-bar text-medium">
      <span>Pies <b id="pieCount">0</b> / <b id="pumpkinTotal">10</b></span>
      <span id="timer">0.0 s</span>
    </header>

    <!-- The pumpkins move around inside this area. pie-maker.js adds them. -->
    <main class="field" id="field"></main>

    <!-- Shown when every pumpkin is a pie. -->
    <div class="done" id="doneMessage" hidden>
      <p class="text-large">All pies made!</p>
      <p class="text-medium" id="doneTime"></p>
      <button class="play-again text-medium" id="playAgain">Play again</button>
    </div>

    <script src="./pie-maker.js"></script>
  </body>
</html>
