<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pie Maker</title>
    <!-- This page is shown inside the app's game panel (an iframe), but it
     also works on its own: open games/game1/index.html directly to test it. -->
    <link rel="stylesheet" href="./game1.css" />
  </head>

  <body>
    <!-- PIE MAKER: tap the moving pumpkins to turn them into pies. -->

    <!-- Info bar at the top of the game: pies made, and time taken. -->
    <header class="info-bar">
      <span>Pies <b id="pieCount">0</b> / <b id="pumpkinTotal">10</b></span>
      <span id="timer">0.0 s</span>
    </header>

    <!-- The pumpkins move around inside this area. game1.js adds them. -->
    <main class="field" id="field"></main>

    <!-- Shown when every pumpkin is a pie. -->
    <div class="done" id="doneMessage" hidden>
      <p class="done-title">All pies made!</p>
      <p class="done-time" id="doneTime"></p>
      <button class="play-again" id="playAgain">Play again</button>
    </div>

    <script src="./game1.js"></script>
  </body>
</html>
