<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e1a44">
  <title>Candy Swap · Swap demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100dvh; overflow: hidden; display: grid; place-items: center; background: #2e1a44; font-family: Arial, sans-serif; padding: max(5dvh, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(5dvh, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left)); }
    .shell { width: min(calc(100vw - 8px), calc((90dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .5625)); aspect-ratio: 9/16; container-type: inline-size; border: 2px solid #e8741c; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    header, footer { flex: 0 0 11.111cqw; color: white; display: flex; align-items: center; justify-content: space-around; gap: 1cqw; font-size: max(12px, 3.6cqw); }
    header { border-bottom: 2px solid #9b7cc4; }
    footer { background: #173229; border-top: 2px solid #5fbf8f; }
    iframe { display: block; flex: 1; min-height: 0; width: 100%; border: 0; }
    button { font: inherit; color: white; border: 1px solid #ffffff70; border-radius: 2cqw; padding: 2cqw; background: #ffffff15; touch-action: manipulation; }
  </style>
</head>
<body>
  <div class="shell">
    <header><strong>Candy Swap</strong><span id="totalScore" aria-live="polite">Total score: …</span></header>
    <iframe id="game" src="./index.html" title="Candy touch board"></iframe>
    <footer><span>Choose two candies</span><button id="targets" aria-pressed="false">Touch areas</button><button id="clear">Clear</button></footer>
  </div>
  <script>
    const frame = document.getElementById('game');
    const targets = document.getElementById('targets');
    targets.onclick = () => {
      const show = targets.getAttribute('aria-pressed') !== 'true';
      targets.setAttribute('aria-pressed', String(show));
      targets.textContent = show ? 'Hide areas' : 'Touch areas';
      frame.contentWindow.postMessage({type:'candy-swap-targets', show}, location.origin);
    };
    document.getElementById('clear').onclick = () => frame.contentWindow.postMessage({type:'candy-swap-clear'}, location.origin);
    window.addEventListener('message', event => {
      if (event.source === frame.contentWindow && event.origin === location.origin && event.data?.type === 'candy-swap-score') document.getElementById('totalScore').textContent = 'Total score: ' + event.data.total;
    });
  </script>
</body>
</html>
