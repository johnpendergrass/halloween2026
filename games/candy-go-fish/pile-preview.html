<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Candy pile study</title>
  <link rel="stylesheet" href="./pile-preview.css">
</head>
<body>
  <main>
    <header><h1>Candy pile study</h1><p>Compare sparse, medium and full piles on the actual board.</p></header>
    <section class="controls" aria-label="Pile appearance">
      <label>Main dish size <output id="dishSizeValue"></output><input id="dishSize" type="range" min="25" max="100" step="1" value="78"></label>
      <label>Wendy tray size <output id="traySizeValue"></output><input id="traySize" type="range" min="20" max="45" step="1" value="45"></label>
      <label>Main rotation <output id="rotationValue"></output><input id="rotation" type="range" min="0" max="85" step="5" value="65"></label>
      <label>Wendy rotation <output id="trayRotationValue"></output><input id="trayRotation" type="range" min="0" max="85" step="5" value="50"></label>
      <label>Main spread X <output id="spreadXValue"></output><input id="spreadX" type="range" min="0" max="25" step="1" value="22"></label>
      <label>Main spread Y <output id="spreadYValue"></output><input id="spreadY" type="range" min="0" max="25" step="1" value="20"></label>
      <label>Color intensity <output id="saturationValue"></output><input id="saturation" type="range" min="10" max="100" step="5" value="50"></label>
      <label>Brightness <output id="brightnessValue"></output><input id="brightness" type="range" min="70" max="120" step="5" value="100"></label>
      <div class="actions"><button id="reroll" type="button">Try another arrangement</button><button id="actualStart" type="button">Middle board: 20 / 5</button></div>
    </section>
    <section id="comparisons" class="comparisons" aria-label="Pile counts"></section>
    <p class="note">The game is a locked visual snapshot here. Candy positions stay fixed until you change the controls or try another arrangement. Moving a candy changes its position and layer only.</p>
    <p id="status" role="status">Loading board previews…</p>
  </main>
  <script src="./pile-preview.js"></script>
</body>
</html>
